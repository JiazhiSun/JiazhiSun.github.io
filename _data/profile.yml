short_bio: >-
  <p>
    Jiazhi Sun is a hydrogeology researcher who received his Ph.D. from Hohai University
    under the supervision of Prof. Chunhui Lu. He was also a visiting Ph.D. student at
    Ghent University, hosted by Prof. Thomas Hermans.
  </p>
  <p>
    His research focuses on groundwater flow, seawater intrusion, and freshwater availability
    in coastal aquifers. He develops analytical solutions and combines them with numerical
    simulations to investigate how aquifer heterogeneity, groundwater pumping, and engineering
    measures influence coastal groundwater systems. He also seeks to extend the application
    of analytical methods to other fields. His work also includes hydrogeophysical
    characterization and uncertainty analysis.
  </p>

