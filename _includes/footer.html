<footer class="footer flex-shrink-0 border-top py-2 mt-5 bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i>Last updated: {{ site.data.display.last_updated | date: "%b %d, %Y" }}</i>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    {% if site.data.display.show_visitor_count %}
                    <div id="busuanzi_container_site_uv" title="{% if jekyll.environment == 'production' %}Estimated unique visitors to this website{% else %}Visitor statistics are available on the published website{% endif %}">
                        <i class="fas fa-users" aria-hidden="true"></i> Visitors: <span id="busuanzi_value_site_uv">N/A</span>
                    </div>
                    {% endif %}
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
    </div>
</footer>
{% if site.data.display.show_visitor_count and jekyll.environment == 'production' %}
<!-- Count visits on the published website; development previews do not load analytics. -->
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
{% endif %}
