<section class="coauthor-map-section mb-4" aria-labelledby="coauthor-map-heading">
    <h1 id="coauthor-map-heading" class="h2 mb-3">Coauthor Locations</h1>
    <div class="card border-0 shadow-sm bg-white coauthor-map-card">
        <div id="coauthor-map" class="coauthor-map" role="region" aria-label="Map of coauthor locations" aria-describedby="coauthor-map-status"></div>
        <p id="coauthor-map-status" class="coauthor-map-status text-muted small" role="status">Loading map…</p>
    </div>
    <script id="coauthor-map-data" type="application/json">[
        {% for location in site.data.coauthor_locations %}
        [{{ location.latitude | jsonify }}, {{ location.longitude | jsonify }}]{% unless forloop.last %},{% endunless %}
        {% endfor %}
    ]</script>
</section>
